- project: Undergraduate Thesis 
  duration: August, 2024 &mdash; Dec, 2024
  url: "https://github.com/Satvik713/mbSTATS"
  description: I completed my undergraduate thesis on the topic of metabolomics research with machine learning. The the usage of novel deep learning algorithms wasn't possible due to the size of the dataset. While working on the analysis of GC-MS data I faced many difficulties in learning complex softwares. So (on recommendation from my advisor) I created a library called 'mbSTATS' which is a collection of all the tools and techniques required for the pre-liminary analysis of GC-MS data. The library is written in Python and is open-source. The library is currently being used by the metabolomics research group at BITS Pilani.

